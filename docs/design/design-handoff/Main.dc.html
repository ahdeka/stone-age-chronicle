<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>잿빛강 사람들 — 인트로</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0c0b0a}
a{color:#e0a15a}a:hover{color:#f0bd7f}
@keyframes sceneIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
@keyframes driftSlow{from{transform:translateX(0)}to{transform:translateX(-40px)}}
@keyframes driftMid{from{transform:translateX(0)}to{transform:translateX(-90px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes flicker{0%,100%{opacity:.85;transform:scale(1)}30%{opacity:1;transform:scale(1.06)}60%{opacity:.75;transform:scale(.97)}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(-30px,-260px);opacity:0}}
@keyframes fall{0%{transform:translate(0,-40px);opacity:0}15%{opacity:.8}100%{transform:translate(60px,520px);opacity:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes titleIn{from{opacity:0;transform:translateY(16px);letter-spacing:.3em}to{opacity:1;transform:translateY(0);letter-spacing:.08em}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.scene{animation:sceneIn 3.2s ease-out both;transform-origin:50% 70%}
.far{animation:driftSlow 40s ease-in-out infinite alternate}
.mid{animation:driftMid 34s ease-in-out infinite alternate}
.star{animation:twinkle 3.4s ease-in-out infinite}
.fire{animation:flicker 1.3s ease-in-out infinite;transform-origin:1012px 640px;transform-box:view-box}
.ember{animation:rise 4.5s linear infinite}
.mote{animation:fall 9s linear infinite}
.ln-ochre{fill:none;stroke:#c9813a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ln-bone{fill:none;stroke:#d9cbb2;stroke-width:1.6;stroke-linecap:round;opacity:.55}
.ln-reed{fill:none;stroke:#3a3226;stroke-width:3;stroke-linecap:round}
.line{margin:0;font-family:'Noto Serif KR',serif;font-size:26px;line-height:1.75;transition:color 1.2s ease,opacity 1.2s ease}
.now{color:#f1e8d8}
.past{color:#a89c88}
.caret{display:inline-block;width:2px;height:1.05em;margin-left:4px;vertical-align:-0.15em;background:#e0a15a;animation:blink 1s steps(1) infinite}
.title-wrap{animation:fadeUp 1.4s ease-out both}
.title{animation:titleIn 2.2s ease-out both}
.later{animation:fadeUp 1.2s ease-out 1.4s both}
.later2{animation:fadeUp 1.2s ease-out 2.2s both}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 640px; overflow: hidden; background: #0c0b0a; color: #f1e8d8; font-family: 'Noto Sans KR', sans-serif">

  <svg class="scene" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:#07080c"></stop>
        <stop offset="0.55" style="stop-color:#161519"></stop>
        <stop offset="1" style="stop-color:#3a2a1c"></stop>
      </linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" style="stop-color:#f0a24a;stop-opacity:0.75"></stop>
        <stop offset="0.45" style="stop-color:#b8612a;stop-opacity:0.25"></stop>
        <stop offset="1" style="stop-color:#b8612a;stop-opacity:0"></stop>
      </radialGradient>
    </defs>
    <rect x="0" y="0" width="1440" height="900" fill="url(#sky)"></rect>
    <circle class="star" cx="160" cy="90" r="1.6" fill="#e9dfcc"></circle>
    <circle class="star" cx="320" cy="160" r="1.2" fill="#e9dfcc" style="animation-delay:1.1s"></circle>
    <circle class="star" cx="510" cy="70" r="1.8" fill="#e9dfcc" style="animation-delay:.4s"></circle>
    <circle class="star" cx="690" cy="140" r="1.1" fill="#e9dfcc" style="animation-delay:2.2s"></circle>
    <circle class="star" cx="860" cy="60" r="1.5" fill="#e9dfcc" style="animation-delay:1.7s"></circle>
    <circle class="star" cx="1010" cy="120" r="1.2" fill="#e9dfcc" style="animation-delay:.9s"></circle>
    <circle class="star" cx="1180" cy="80" r="1.7" fill="#e9dfcc" style="animation-delay:2.6s"></circle>
    <circle class="star" cx="1330" cy="170" r="1.3" fill="#e9dfcc" style="animation-delay:.2s"></circle>
    <circle class="star" cx="240" cy="230" r="1" fill="#e9dfcc" style="animation-delay:3s"></circle>
    <circle class="star" cx="1260" cy="250" r="1" fill="#e9dfcc" style="animation-delay:1.4s"></circle>
    <circle cx="1120" cy="190" r="34" fill="#d9cbb2" opacity="0.18"></circle>
    <circle cx="1120" cy="190" r="22" fill="#e9dfcc" opacity="0.5"></circle>

    <g class="far">
      <path d="M-60 520 L120 400 L230 450 L380 330 L520 430 L640 370 L790 460 L930 350 L1080 440 L1220 380 L1380 450 L1520 400 L1520 900 L-60 900 Z" fill="#1b1a1d"></path>
      <path class="ln-bone" d="M120 400 L230 450 L380 330 L520 430 M930 350 L1080 440 L1220 380"></path>
    </g>
    <g class="mid">
      <path d="M-120 610 Q160 520 380 580 T820 560 T1260 590 T1600 570 L1600 900 L-120 900 Z" fill="#141210"></path>
    </g>

    <path d="M-20 760 C220 700 420 740 600 700 C780 660 860 720 1040 700 C1220 680 1340 720 1480 690 L1480 740 C1340 770 1220 730 1040 752 C860 772 780 712 600 752 C420 792 220 752 -20 812 Z" fill="#23272b"></path>
    <path class="ln-bone" d="M40 770 C240 718 420 752 600 714 M760 690 C860 724 960 708 1040 704 M1150 700 C1260 690 1340 716 1440 698"></path>

    <path d="M860 520 C930 470 1060 450 1180 480 C1260 500 1330 560 1360 640 L1360 700 L880 700 C900 640 880 580 860 520 Z" fill="#100e0c"></path>
    <path class="ln-ochre" d="M880 540 C950 495 1060 480 1170 505 C1240 522 1300 570 1330 630"></path>

    <g>
      <path d="M920 680 L955 612 L990 680 Z" fill="#2c2219"></path>
      <path class="ln-ochre" d="M920 680 L955 612 L990 680 M955 612 L955 680"></path>
      <path d="M1040 684 L1080 606 L1120 684 Z" fill="#2c2219"></path>
      <path class="ln-ochre" d="M1040 684 L1080 606 L1120 684 M1080 606 L1080 684"></path>
      <path d="M1140 682 L1172 622 L1204 682 Z" fill="#2c2219"></path>
      <path class="ln-ochre" d="M1140 682 L1172 622 L1204 682"></path>
      <path d="M1215 686 L1250 618 L1285 686 Z" fill="#2c2219"></path>
      <path class="ln-ochre" d="M1215 686 L1250 618 L1285 686"></path>
      <path d="M985 690 L1010 645 L1035 690 Z" fill="#2c2219"></path>
      <path class="ln-ochre" d="M985 690 L1010 645 L1035 690"></path>
    </g>

    <ellipse cx="1012" cy="660" rx="170" ry="110" fill="url(#glow)" class="fire"></ellipse>
    <g class="fire">
      <path d="M1000 682 C996 664 1006 652 1012 640 C1018 652 1028 664 1024 682 Z" fill="#e0893a"></path>
      <path d="M1006 682 C1004 670 1010 662 1013 654 C1016 662 1021 670 1019 682 Z" fill="#f6c46a"></path>
    </g>
    <path class="ln-ochre" d="M990 690 L1036 680 M992 680 L1034 692"></path>
    <circle class="ember" cx="1012" cy="640" r="2" fill="#f6c46a"></circle>
    <circle class="ember" cx="1018" cy="646" r="1.5" fill="#f0a24a" style="animation-delay:1.5s"></circle>
    <circle class="ember" cx="1006" cy="642" r="1.8" fill="#f6c46a" style="animation-delay:3s"></circle>

    <circle class="mote" cx="200" cy="300" r="2" fill="#d9cbb2" opacity="0"></circle>
    <circle class="mote" cx="460" cy="260" r="1.6" fill="#d9cbb2" opacity="0" style="animation-delay:2s"></circle>
    <circle class="mote" cx="720" cy="320" r="2.2" fill="#d9cbb2" opacity="0" style="animation-delay:4s"></circle>
    <circle class="mote" cx="980" cy="240" r="1.4" fill="#d9cbb2" opacity="0" style="animation-delay:6s"></circle>
    <circle class="mote" cx="1250" cy="300" r="1.8" fill="#d9cbb2" opacity="0" style="animation-delay:1s"></circle>
    <circle class="mote" cx="600" cy="200" r="1.2" fill="#d9cbb2" opacity="0" style="animation-delay:7s"></circle>

    <path class="ln-reed" d="M60 900 L80 790 M90 900 L104 770 M120 900 L128 800 M1340 900 L1352 790 M1372 900 L1380 770 M1400 900 L1404 806"></path>
  </svg>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,7,6,0.92) 0%, rgba(8,7,6,0.7) 42%, rgba(8,7,6,0.05) 72%)"></div>

  <div style="position: relative; display: flex; justify-content: space-between; align-items: center; padding: 28px 48px">
    <p style="margin: 0; font-size: 14px; letter-spacing: 0.24em; color: #b3a690">제1장 · 구석기</p>
    <div style="display: flex; gap: 12px; align-items: center">
      <sc-if value="{{notTitle}}" hint-placeholder-val="{{ true }}">
        <span style="font-size: 14px; color: #b3a690">{{seconds}}초</span>
        <button type="button" onClick="{{skip}}" style="min-height: 44px; padding: 0 20px; border-radius: 22px; border: 1px solid #5a4d3c; background: rgba(20,17,14,0.7); color: #f1e8d8; font-family: 'Noto Sans KR', sans-serif; font-size: 15px; cursor: pointer">건너뛰기</button>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{notTitle}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 48px; right: 48px; bottom: 120px; max-width: 780px; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="3">
        <p class="{{item.cls}}">{{item.text}}<sc-if value="{{item.typing}}" hint-placeholder-val="{{ false }}"><span class="caret"></span></sc-if></p>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{showTitle}}" hint-placeholder-val="{{ false }}">
    <div class="title-wrap" style="position: absolute; left: 48px; right: 48px; bottom: 110px; max-width: 820px; display: flex; flex-direction: column; gap: 20px">
      <p class="later" style="margin: 0; font-size: 15px; letter-spacing: 0.24em; color: #e0a15a">낙엽달 · 늦가을 · 서른네 명</p>
      <h1 class="title" style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 76px; font-weight: 700; line-height: 1.1; color: #f1e8d8">잿빛강 사람들</h1>
      <p class="later" style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 22px; line-height: 1.7; color: #cbbfa9">첫 겨울이 다가온다. 무엇을 먼저 지킬 것인가.</p>
      <div class="later2" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px">
        <a href="Turn.dc.html" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 26px; background: #e0a15a; color: #17120c; font-size: 17px; font-weight: 700; text-decoration: none">첫 달을 시작한다</a>
        <button type="button" onClick="{{replay}}" style="min-height: 52px; padding: 0 24px; border-radius: 26px; border: 1px solid #5a4d3c; background: transparent; color: #f1e8d8; font-family: 'Noto Sans KR', sans-serif; font-size: 16px; cursor: pointer">다시 보기</button>
      </div>
    </div>
  </sc-if>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(90,77,60,0.5)">
    <div style="height: 3px; width: {{pct}}%; background: #e0a15a; transition: width 0.2s linear"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"typeSpeed":{"editor":"range","default":55,"min":25,"max":110,"step":5,"unit":"ms","section":"인트로"},"$preview":{"width":1440,"height":900}}'>
var LINES = [
  '빙하기의 끝자락, 북쪽 땅.',
  '잿빛강은 고원에서 흘러내려 넓게 굽이친다.',
  '강 굽이의 바위 그늘 아래, 가죽 천막 다섯 채.',
  '서른네 명. 성인 열여덟, 노인 넷, 아이 열둘.',
  '지난여름은 짧았고, 사냥은 신통치 않았다.',
  '밤마다 서리가 내린다. 겨울까지 두 달 남짓.',
  '남은 식량은 열여드레분.',
  '당신은 이 사람들의 족장이다.'
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { elapsed: 0 };
    this.start = Date.now();
    this.offset = 0;
  }
  componentDidMount() {
    var self = this;
    this.start = Date.now();
    this.timer = setInterval(function () {
      self.setState({ elapsed: Date.now() - self.start + self.offset });
    }, 50);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    var self = this;
    var speed = this.props.typeSpeed ?? 55;
    var t = 1600;
    var starts = [];
    LINES.forEach(function (l) { starts.push(t); t += l.length * speed + 650; });
    var end = t + 400;
    var e = this.state.elapsed;
    var current = -1;
    LINES.forEach(function (l, i) { if (e >= starts[i]) current = i; });
    var items = [];
    LINES.forEach(function (txt, i) {
      if (e < starts[i]) return;
      var n = Math.max(0, Math.min(txt.length, Math.floor((e - starts[i]) / speed)));
      items.push({ text: txt.slice(0, n), typing: n < txt.length, cls: i === current ? 'line now' : 'line past' });
    });
    var showTitle = e >= end;
    return {
      items: items,
      showTitle: showTitle,
      notTitle: !showTitle,
      pct: Math.min(100, Math.round((e / end) * 100)),
      seconds: Math.max(0, Math.ceil((end - e) / 1000)),
      skip: function () { self.offset = end - (Date.now() - self.start); },
      replay: function () { self.start = Date.now(); self.offset = 0; self.setState({ elapsed: 0 }); }
    };
  }
}
</script>
</body>
</html>
